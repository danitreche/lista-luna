<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Foto do produto pendente</title>
  <desc id="desc">Imagem decorativa do Reino Encantado indicando que o produto precisa de revisão manual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ddff"/>
      <stop offset=".55" stop-color="#ffe5ef"/>
      <stop offset="1" stop-color="#fff1c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6f3ca6" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <circle cx="160" cy="105" r="56" fill="#fff" opacity=".44"/>
  <circle cx="760" cy="420" r="82" fill="#fff" opacity=".35"/>
  <g fill="#d9aa48" opacity=".9">
    <path d="M112 350l9 22 22 9-22 9-9 22-9-22-22-9 22-9z"/>
    <path d="M768 100l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
